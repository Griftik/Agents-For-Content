name: Catch

on:
  push:
    branches: [main, claude/leisure-planner-core]
    paths: ["leisure/**", ".github/workflows/catch.yml"]
  pull_request:
    paths: ["leisure/**", ".github/workflows/catch.yml"]
  workflow_dispatch:

env:
  DATABASE_URL: postgresql+psycopg://leisure:leisure@localhost:5432/leisure
  API_KEY: ci-test-key
  SECRET_KEY: ci-secret-key-not-for-prod
  ADMIN_PASSWORD: ci-admin
  WEB_BASE_URL: http://localhost:3000

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: leisure
          POSTGRES_USER: leisure
          POSTGRES_PASSWORD: leisure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leisure -d leisure"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: leisure/requirements.txt
      - run: pip install -r leisure/requirements.txt
      - name: Миграции и seed
        run: |
          alembic -c leisure/alembic.ini upgrade head
          python -m leisure.seed.load
      - name: Тесты (без симулятора — он исключён в tests/conftest.py)
        run: cd leisure && python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leisure/webapp/package-lock.json
      - name: Веб (сборка и vitest)
        working-directory: leisure/webapp
        run: |
          npm ci
          npm run build
          npx vitest run

  # Контур безопасности на каждом изменении: статанализ кода, уязвимости python- и npm-зависимостей. Красный security = нет деплоя.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: leisure/requirements.txt
      - run: pip install -r leisure/requirements.txt bandit pip-audit
      - name: Статанализ кода (bandit, medium+)
        run: bandit -r leisure -ll -q -x leisure/tests,leisure/sim,leisure/webapp,leisure/data
      - name: Уязвимости python-зависимостей
        run: pip-audit -r leisure/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leisure/webapp/package-lock.json
      - name: Уязвимости npm-зависимостей (high+)
        working-directory: leisure/webapp
        run: |
          npm ci
          npm audit --audit-level=high

  deploy:
    # Уезжает на сервер только после зелёных тестов и только если автодеплой включён переменной репозитория DEPLOY_ENABLED=true
    # (Settings → Secrets and variables → Actions → Variables). deploy.sh сам снимает бэкап перед накатом и откатывается при провале.
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/leisure-planner-core') && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: cd ~/Agents-For-Content && DEPLOY_BRANCH=${{ github.ref_name }} ./leisure/deploy.sh
