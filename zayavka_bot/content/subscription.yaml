# Платная подписка «Индивидуальная бизнес-аналитика». Меняется без деплоя: правка + /reload.
#
# Оплата:
#   • в рублях через ЮKassa — если в .env задан PAYMENT_PROVIDER_TOKEN (выдаёт @BotFather → Payments);
#   • в Telegram Stars — если токена нет, а price_stars > 0.
# Пока цена = 0 (и в рублях, и в звёздах), подписка в боте не показывается.
#
# Тексты ниже — ЧЕРНОВИК. Разделы аналитики, источники и цену обсуждаем с Евгением отдельно.
# Пока цена 0, подписка в боте не видна.

price_rub: 0          # TODO(Евгений): цена за период в рублях, например 990
price_stars: 0        # цена в звёздах, если без ЮKassa (1 звезда ≈ 1–2 ₽ для покупателя)
days: 30              # период подписки
remind_before_days: 3 # за сколько дней напомнить о продлении

title: "Индивидуальная бизнес-аналитика"   # заголовок счёта, до 32 символов
invoice_description: "Индивидуальная бизнес-аналитика для собственника: регулярные материалы в Telegram-боте. Доступ на {days} дней."   # до 255 символов

texts:
  menu_button: "Бизнес-аналитика"
  pitch: |
    Индивидуальная бизнес-аналитика: что меняется вокруг вашего бизнеса и что это значит для решений собственника.
    Приходит сюда, в бот. {price} за {days} дней.
  buy_button: "Оформить за {price}"
  active: "Подписка на бизнес-аналитику действует до {date}."
  renew_button: "Продлить на {days} дней за {price}"
  paid: |
    Оплата прошла. Подписка действует до {date}. Материалы будут приходить сюда.
  expiring: |
    Подписка на бизнес-аналитику заканчивается {date}. Продлить?
  expired: |
    Подписка на бизнес-аналитику закончилась. Вернуться можно в любой момент.
  price_changed: "Цена изменилась. Откройте подписку заново: /subscribe"
  unavailable: "Подписка сейчас недоступна."
  offer_line: "Оформляя подписку, вы принимаете условия оферты: {offer_url}"
