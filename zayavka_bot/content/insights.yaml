# Тизеры: два наблюдения по ответам, показываются до запроса телефона. Без LLM, по правилам.
# Правило: первое подходящее из блока first, первое подходящее из блока second. Если ничего не подошло — default.
# Условия: код вопроса = код ответа; несколько условий через запятую = все одновременно.

first:
  - when: { pain: projects_not_done, strategy_state: [in_my_head, none] }
    text: "Проекты не доходят до реализации чаще всего там, где цель есть у собственника, а у команды есть список задач. Это не про дисциплину, это про то, кто автор решения."
  - when: { pain: projects_not_done }
    text: "Цель известна, а проекты всё равно стоят. Обычно решения приняты без проверки ресурсов и без человека, который отвечает за них деньгами и временем."
  - when: { pain: revenue_no_profit }
    text: "Рост выручки без роста прибыли — признак, что компания масштабирует процессы, которые сами по себе не окупаются. Команда обычно видит это раньше собственника, но не говорит."
  - when: { pain: no_initiative }
    text: "Команда не проявляет инициативу там, где инициатива ничего не меняет: решения всё равно принимаются наверху. Это лечится не мотивацией, а устройством принятия решений."
  - when: { pain: no_time_ops }
    text: "Нет времени на стратегию — значит, стратегия существует только в голове собственника и не передана команде. Пока так, операционка будет возвращаться."
  - when: { pain: scale_unknown }
    text: "Масштабировать текущей командой можно, если у команды есть собственный план и границы полномочий. Обычно не хватает не людей, а договорённостей."
  - when: { pain: partners_disagree }
    text: "Партнёры не договариваются о приоритетах, когда у каждого своя картина будущего компании. Спор про задачи почти всегда оказывается спором про цель."
  - when: { pain: strategy_on_paper }
    text: "Стратегия, в которую никто не заглядывает, написана не теми, кто её исполняет. Документ, который команда собрала сама, живёт иначе."

second:
  - when: { tried: diy_session }
    text: "Сессия своими силами часто заканчивается списком идей без владельцев: внутри компании некому держать рамку и задавать неудобные вопросы."
  - when: { tried: external_facilitator }
    text: "После внешнего ведущего проекты не пошли — как правило, потому что сессия закончилась планом, а не проверкой решений на деньги."
  - when: { tried: consultants_trackers }
    text: "Консультанты и трекеры приносят решения снаружи. Команда исполняет чужое, а чужое исполняется до первого препятствия."
  - when: { decisions: alone }
    text: "Когда решения принимает один человек, команда исполняет, а не отвечает. Ответственность появляется вместе с участием в решении."
  - when: { decisions: chaotic }
    text: "Решения по ситуации означают, что приоритеты меняются быстрее, чем команда успевает их отработать. Люди перестают начинать длинные проекты."
  - when: { strategy_state: doc_not_working }
    text: "Документ стратегии не работает, когда в нём нет решений, за которые кто-то отвечает. Список направлений — не стратегия."
  - when: { decisions: partners_2_3 }
    text: "Решения в кругу партнёров без команды дают быстрый старт и медленное исполнение: те, кто делает, узнают о решении последними."
  - when: { outcome_6m: team_drives }
    text: "Команда начинает двигать проекты сама, когда сама их выбирала и считала. Проекты, спущенные сверху, двигает только тот, кто спустил."

default:
  first: "По ответам видно, что вопрос не в отсутствии идей, а в том, как компания превращает их в решения и кто за них отвечает."
  second: "Подробнее разберу в письменном виде: где узкое место, какой формат работы подходит и что можно сделать самим."
