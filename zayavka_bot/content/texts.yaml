# Тексты бота. От первого лица Евгения, на «вы», без восклицаний и эмодзи.
# {name} — имя из профиля Telegram, {pain_text} — боль словами клиента, {n} — номер вопроса.

# --- Вход ---------------------------------------------------------------
welcome_video_note: "content/media/welcome.mp4"   # кружок 20 секунд, отправляется первым, если файл есть
welcome: |
  Это заявка на разбор для собственников и руководителей.
  11 вопросов, 3 минуты. По ответам пришлю письменный разбор вашей ситуации: где узкое место, какой формат работы с командой подходит и что можно сделать самим.
  Если увижу, что могу быть полезен, предложу созвониться на 30 минут.
start_button: "Заполнить заявку"

# --- Возврат в бот -------------------------------------------------------
resume: "Вы остановились на вопросе {n}. Продолжим с него."
resume_button: "Продолжить"
restart_button: "Начать заново"
already_done: |
  Заявка у меня. Что сделать?
menu_buttons:
  report: "Прислать разбор ещё раз"
  booking: "Записаться на разбор"
  notify_toggle: "Сообщения от меня: {state}"
  delete: "Удалить мои данные"

# --- Вопросы -------------------------------------------------------------
progress: "Вопрос {n} из 11"
back_button: "Назад"
skip_button: "Пропустить"

# --- Тизер и контакт -----------------------------------------------------
teaser_intro: "Спасибо. Два наблюдения по вашим ответам, пока готовлю разбор:"
# сами наблюдения — в insights.yaml
ask_contact: |
  Полный разбор пришлю сюда, в чат. Чтобы я мог связаться, если решите обсуждать, оставьте телефон.
  Без рассылок и звонков без договорённости.
contact_button: "Поделиться телефоном"
consent_line: "Нажимая кнопку, вы соглашаетесь на обработку персональных данных: {privacy_url}"
contact_later_button: "Пришлите разбор без телефона"
ask_company: "Как называется компания? Можно пропустить."
company_skip_button: "Пропустить"

# --- Ожидание разбора (MVP: документ делает Евгений вручную) --------------
report_pending: |
  Принял. Разбор пришлю в течение часа в рабочее время, ночью — утром.
report_sent_intro: "Ваш разбор. Главное — в первых трёх абзацах, дальше кейс и что сделать до сессии."
report_next_button: "Что дальше"

# --- Горячие -------------------------------------------------------------
hot_offer: |
  Посмотрел ваши ответы. Вижу: {pain_text}.
  Есть мысль, что с этим делать. Готов обсудить 30 минут: что видно по ответам и что бы я делал на вашем месте. Письменный разбор пришлю следом.
hot_button: "Выбрать время"
hot_booking_url_text: "Выберите удобное время по ссылке. После записи напишу, что подготовить к разговору."
hot_reminder_24h: |
  Напоминаю про разбор: если время не подобралось, напишите, какое удобно, подстроюсь.
hot_reminder_72h: |
  Если сейчас не время, ничего страшного. Разбор у вас, вернуться к разговору можно в любой момент кнопкой ниже.
booking_confirmed: |
  Записал: {slot}. За день напомню. Перед разговором перечитайте разбор и отметьте, с чем не согласны: с этого и начнём.
booking_reminder_24h: "Завтра в {time} разбор. Если планы поменялись, перенесите заранее."
booking_reminder_1h: "Через час созвон. Ссылка: {link}"

# --- Тёплые --------------------------------------------------------------
warm_intro: |
  Разбор у вас. Когда в канале выйдет что-то действительно важное по вашей теме, пришлю сюда. Без потока сообщений.
  Если захотите обсудить, кнопка ниже работает всегда.
warm_button: "Записаться на разбор"

# --- HR и директора по развитию -------------------------------------------
initiator_intro: |
  Разбор у вас. Такие решения обычно принимает собственник, поэтому написал разбор так, чтобы его можно было переслать без комментариев.
  Если будет полезно, готов созвониться втроём на 20 минут: вы, собственник и я.

# --- Специалисты ---------------------------------------------------------
specialist_docs: |
  Документы для подготовки сессии ниже. Это рабочие материалы, а не шаблоны: смотрите на логику, а не на формулировки.
specialist_channel: "Разборы и материалы по стратегической работе с командами выходят в канале."
specialist_channel_button: "Открыть канал"
specialist_training_ask: "Готовлю обучение для фасилитаторов. Присылать анонс, когда откроется набор?"
yes_button: "Да"
no_button: "Нет"

# --- Общее ---------------------------------------------------------------
text_forwarded: "Передал Евгению, ответит лично."
notify_on: "включены"
notify_off: "выключены"
notify_toggled: "Сообщения от меня теперь {state}."
delete_confirm: "Удалить телефон, имя, компанию и ответы? Восстановить не получится."
delete_done: "Данные удалены. Если захотите вернуться, заявку можно заполнить заново."
error_generic: "Что-то пошло не так. Напишите мне текстом, разберусь вручную."

# --- Карточка админу -----------------------------------------------------
admin_card: |
  {segment_icon} {segment_label} (score {score}) | источник: {source}
  {name}, {company}, роль: {role}
  Штат {team_size}, выручка {revenue}, срок: {timeline}
  Боль: {pain}
  Хочет: {outcome_6m}
  Стратегия: {strategy_state}. Решения: {decisions}. Пробовали: {tried}. Участники: {participants}
  Тип сессии: {session_type} (+ {session_type_2})
  Телефон: {phone} | Telegram: {tg_link}
admin_buttons:
  write: "Написать"
  contacted: "Отметить: связался"
  send_report: "Отправить разбор"
segment_labels:
  hot: "Горячий лид"
  warm: "Тёплый лид"
  warm_initiator: "Тёплый лид, инициатор (нужен выход на собственника)"
  specialist: "Специалист"
segment_icons:
  hot: "🔥"
  warm: "•"
  warm_initiator: "•"
  specialist: "·"

# --- Согласие галочкой (на первом экране, до любых вопросов) ----------------
# Галочка не стоит заранее: согласие по 152-ФЗ должно быть явным действием человека.
consent_off: "☐ Согласен на обработку данных"
consent_on: "☑ Согласен на обработку данных"
consent_policy_button: "Подробнее ↗"   # ведёт на текст согласия, оттуда — на политику
consent_needed: "Отметьте галочку согласия — и начнём."   # всплывающая подсказка, не сообщение

# --- Важное из канала -------------------------------------------------------
digest_channel_button: "Читать в канале"
