ые шоу пройдут в Театре Российской Армии. Концерт Александра Розенбаума Александр Розенбаум — народный артист России, автор песен о криминале, военной доблести и сентиментальной романтике. Его печальный и мужественный баритон знаком всем. Песни Розенбаума часто попадают в кино и на сцену, а его концерты — всегда диалог о насущном, о том, что волнует каждого. В 2025 году по песням Александра Розенбаума создали мюзикл «Вальс-бостон», лирическую музыкальную историю можно посмотреть в Театре Эстрады. Программа Продюсерская компания «АЛРОЗ» приглашает москвичей и гостей столицы на юбилейные концерты Александра Розенбаума на сцену Театра Российской Армии. Двадцать сольных концертов, наполненных неповторимой энергетикой артиста запомнятся как знаменитыми хитами, так и совершенно новыми, недавно написанными произведениями. Каждая встреча с залом — разговор о жизни. Кому подойдёт концерт Александра Розенбаума Концерт для ценителей авторской песни и качественного шансона. Легенда с широчайшим музыкальным репертуаром в камерной обстановке Театра Российской Армии. Для многих поклонников этот концерт — ежегодная осенняя традиция. Купить билеты на концерт Александра Розенбаума Юбилейные концерты Александра Розенбаума в Москве — искренние встречи в камерной атмосфере. От «Вальса-бостона» до «Чёрного тюльпана» — песни, которые расходятся на цитаты. Театр Российской Армии, уютный зал, хорошая акустика — билеты уже в продаже на Афише. Осень 2026 — время слушать Розенбаума.","image":{"url":"https://s5.afisha.ru/mediastorage/05/6d/9685a423561d4b06afd8a5b66d05.jpg","contentUrl":"https://s5.afisha.ru/mediastorage/05/6d/9685a423561d4b06afd8a5b66d05.jpg","width":"904","height":"508","copyrightNotice":"vk.com/alexander_rozenbaum","@type":"ImageObject"},"startDate":"2026-10-24T19:00:00+03:00","endDate":"2026-11-08T19:00:00+03:00","eventStatus":"EventScheduled","eventAttendanceMode":"OfflineEventAttendanceMode","location":{"name":"Театр Российской Армии","url":"https://www.afisha.ru/msk/theat
