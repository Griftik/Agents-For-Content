<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет соединения · Catch</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root { color-scheme: light dark; --bg: #ECEEF1; --fg: #1A1D23; --muted: #5F6876; --accent: #7A1F3D; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141619; --fg: #EAE8E3; --muted: #9BA3AE; --accent: #DE86A0; --accent-ink: #1A0B11; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font: 16px/1.5 'Golos Text','Segoe UI',Arial,sans-serif; }
  main { max-width: 360px; text-align: center; }
  h1 { font: 800 32px/1.05 'Piazzolla',Georgia,'Times New Roman',serif; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 18px; }
  button { font: 500 15px/1.2 inherit; font-family: inherit; padding: 12px 22px; min-height: 48px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Нет соединения</h1>
  <p>Страница не загрузилась. Проверь интернет и обнови её.</p>
  <button type="button" onclick="location.reload()">Обновить</button>
</main>
</body>
</html>
